name: Keep Supabase awake

# Runs every 3 days at 06:00 UTC to prevent the free database
# from auto-pausing during quiet periods. Can also be run manually.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          echo "Pinging Supabase to keep it active..."
          curl -sS -o /dev/null -w "HTTP status: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
